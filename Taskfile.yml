version: "3"

# Tasks are grouped by functional area, areas ordered by when you reach them, and alphanumeric
# within each area. `task -l` sorts alphabetically and would scatter that grouping, so the
# default task lists with --sort none to preserve it.
#
# Two lifecycles share this file, because a generated repo inherits it verbatim:
#   - area 1 runs in the TEMPLATE only, and is where a project begins;
#   - areas 2-10 run in whichever repo you are sitting in;
#   - area 11 runs in a GENERATED repo, periodically, to pull template fixes back down.

vars:
  APP: pkg_pulse
  SRC: src
  TESTS: tests
  # Lint reaches the absorbed package; typecheck and test do not yet. These are separate vars so
  # each target's scope is readable at the point of use — a var that names packages/ocean while
  # the command runs against src is a false claim about what CI verifies (task 1.3).
  LINT_PATHS: src tests packages/archaeology packages/pulse-ledger packages/pulse-core packages/verdict-relay packages/schedules packages/identity packages/consent-ingress packages/synthea-seed packages/twenty-projection packages/billing packages/billing-connector packages/ocean
  # Typecheck reaches ocean's libs but not its 16 services (task 1.4, DNA-779): the services
  # carry 217 mypy errors. Stated here rather than implied, so what CI verifies is readable
  # from this file.
  # schedules, identity, and consent-ingress typecheck under pyright strict (task 1.1, S1.1
  # task 1.1), same as verdict-relay — see typecheck, not this mypy list.
  TYPED_PATHS: src packages/pulse-ledger/src packages/pulse-core/src packages/billing/src packages/ocean/libs/ocean-events/src packages/ocean/libs/ocean-broker/src packages/ocean/libs/ocean-connector-mcp/src
  # Tests reach ocean's libs here; the 14 service suites run in test:services, one pytest
  # process per service (task 4.14, DNA-781). They cannot join this list: every service ships a
  # top-level `src` package and imports itself as `from src.X`, and one interpreter cannot hold
  # sixteen different `src` packages in sys.modules. graph-projection moved from this list into
  # the loop with the rest. tests/test_taskfile_test_coverage.py pins this arrangement.
  # The one explicit file at the end is `packages/ocean/tests/unit`'s only entry: ADR-0002 keeps
  # that cross-service tree out of CI (~60 pre-existing failures), but this single test
  # (snowflake-projection task 1.1) is a self-contained SQL/emitter-comparison check with none
  # of that tree's fixtures, so it is named directly rather than pulling the whole directory in.
  TESTED_PATHS: tests packages/archaeology/tests packages/pulse-ledger/tests packages/pulse-core/tests packages/verdict-relay/tests packages/schedules/tests packages/identity/tests packages/consent-ingress/tests packages/synthea-seed/tests packages/twenty-projection/tests packages/billing/tests packages/billing-connector/tests packages/ocean/libs packages/ocean/tests/unit/test_stg_events_sql.py
  # Coverage covers ocean-events because it is the envelope every consumer depends on, and it is
  # at 100%. ocean-broker joins it at task 2.2: the reason it was excluded — that 2.2 would throw
  # its tests away — expired when 2.2 landed EventBridgePublisher and the event catalog, which are
  # what the library now is. Its config.py is the Kafka half, low-covered and deleted by task 9.2.
  # ocean-connector-mcp is outside this migration, still at 0%, tracked in DNA-779.
  # The pulse packages are covered from their first commit — placeholder-sized today, and the
  # 80% floor applies as they grow rather than being retrofitted later.
  # verdict-relay and schedules each carry their own 85% floor (s12-verdict-relay, s13-schedules);
  # identity carries a 90% floor (s14-identity — wrong matches are the costliest bug in the
  # system); consent-ingress carries an 85% floor (S1.1 task 1.1, same tier as verdict-relay and
  # schedules). Each is enforced by the extra `coverage report` steps in `test` — the global
  # fail_under cannot express a per-package floor.
  COV_PATHS: --cov=src/pkg_pulse --cov=packages/archaeology/src --cov=packages/pulse-ledger/src --cov=packages/pulse-core/src --cov=packages/verdict-relay/src --cov=packages/schedules/src --cov=packages/identity/src --cov=packages/consent-ingress/src --cov=packages/synthea-seed/src --cov=packages/twenty-projection/src --cov=packages/billing/src --cov=packages/billing-connector/src --cov=packages/ocean/libs/ocean-events/src --cov=packages/ocean/libs/ocean-broker/src
  CHANGE: ""
  VISIBILITY: --private

tasks:
  default:
    desc: List tasks grouped by area (alphabetical listing is `task -l`)
    silent: true
    cmds:
      - task --list-all --sort none

  # --- 1. Create (template only) ---

  new-repo:
    desc: Create a new repo from this template (NAME, PKG, DESC; created beside this repo)
    # new-repo.sh runs `gh repo create --clone`, which clones into the current directory. Run
    # from the repo root it would nest the new project inside the template, so the task runs one
    # level up and calls the script by absolute path.
    # Usage: task new-repo NAME=my-project PKG=my_project DESC="A cool new project"
    # Run it from inside this repo; the task moves to the parent itself.
    dir: '{{.ROOT_DIR}}/..'
    requires:
      vars: [NAME, PKG, DESC]
    cmds:
      - |
        if [ -f "{{.ROOT_DIR}}/.ade-template-version" ]; then
          echo "This repo was generated from the ADE template — new-repo belongs in the template itself." >&2
          exit 1
        fi
        bash "{{.ROOT_DIR}}/new-repo.sh" "{{.NAME}}" "{{.PKG}}" "{{.DESC}}" {{.VISIBILITY}}

  # --- 2. Environment ---

  install:
    desc: Setup venv and install dependencies
    cmds:
      - uv sync --all-packages
      - uv run pre-commit install

  mcp:check:
    desc: MCP diagnostics — duplicate scopes, dead servers (see docs/mcp-servers.md)
    silent: true
    cmds:
      - |
        OUT=$(claude mcp list 2>&1); echo "$OUT"
        if echo "$OUT" | grep -q "defined in multiple scopes"; then
          echo "FAIL: MCP server duplicated across scopes — consolidate; per-endpoint OAuth tokens conflict"; exit 1
        fi
        if echo "$OUT" | grep -q "Failed to connect"; then
          echo "FAIL: an MCP server failed to connect — fix or remove it"; exit 1
        fi
        echo "MCP OK"

  # --- 3. Develop ---

  fmt:
    desc: Auto-format and apply fixable lint rules
    cmds:
      - uv run ruff format {{.LINT_PATHS}}
      - uv run ruff check --fix {{.LINT_PATHS}}

  lint:
    desc: Check formatting and lint rules (read-only)
    cmds:
      - uv run ruff format {{.LINT_PATHS}} --check
      - uv run ruff check {{.LINT_PATHS}}

  twenty:gen:
    desc: Regenerate the Twenty app's generated surfaces and the Metadata API operation-set artifact
    # Reads state_catalog.yaml, the model definition, and packages/twenty-app/uid-map.json;
    # writes packages/twenty-app/generated/ and artifact/operations.json. Pure file
    # transformation — no network, and no path that applies anything to a Twenty instance
    # (that is twenty:deploy). A UID the map lacks is an error naming the key, never a mint.
    cmds:
      - uv run python -m pulse_core.twenty_metadata

  typecheck:
    desc: Type check — mypy on TYPED_PATHS (DNA-779), pyright on verdict-relay (s12), schedules (s13), identity (s14), consent-ingress (S1.1 task 1.1), archaeology (bf0a), billing-connector (billing-connector task 1.1)
    cmds:
      - uv run mypy {{.TYPED_PATHS}}
      # verdict-relay, schedules, identity, consent-ingress, archaeology, and billing-connector
      # typecheck under pyright strict (s12-verdict-relay, s13-schedules, s14-identity, S1.1
      # task 1.1, bf0a-archaeology-access, billing-connector task 1.1); pyright is a dev
      # dependency of each package, installed by `uv sync --all-packages`.
      - uv run pyright -p packages/archaeology
      - uv run pyright -p packages/verdict-relay
      - uv run pyright -p packages/schedules
      - uv run pyright -p packages/identity
      - uv run pyright -p packages/consent-ingress
      - uv run pyright -p packages/synthea-seed
      - uv run pyright -p packages/twenty-projection
      - uv run pyright -p packages/billing-connector

  # --- 4. Test ---

  test:
    desc: Run tests with coverage, then every ocean service suite (DNA-781)
    cmds:
      - uv run pytest {{.TESTED_PATHS}} --import-mode=importlib {{.COV_PATHS}} --cov-report=term-missing
      # verdict-relay's, schedules's, and consent-ingress's per-package 85% floors
      # (s12-verdict-relay, s13-schedules, S1.1 task 1.1), and identity's 90% floor
      # (s14-identity), read from the combined run's coverage data — no second test run. The
      # flag overrides the global fail_under.
      - uv run coverage report --include="packages/verdict-relay/src/*" --fail-under=85
      - uv run coverage report --include="packages/schedules/src/*" --fail-under=85
      - uv run coverage report --include="packages/identity/src/*" --fail-under=90
      - uv run coverage report --include="packages/consent-ingress/src/*" --fail-under=85
      - task: test:services

  test:services:
    desc: Run each ocean service's tests, one pytest process per service
    # One process per service because each ships a top-level `src` package imported as
    # `from src.X` — the suites cannot share an interpreter (see TESTED_PATHS note). Services
    # stay outside the coverage floor (DNA-779). Every failing suite is reported, not just the
    # first. mongodb-connector and warehouse-sync have no tests directory to run — a gap in
    # those services, tracked by tests/test_taskfile_test_coverage.py.
    cmds:
      - |
        failed=""
        for dir in packages/ocean/services/*/tests; do
          echo "=== ${dir%/tests}"
          uv run pytest "$dir" -q || failed="$failed ${dir%/tests}"
        done
        if [ -n "$failed" ]; then
          echo "FAILED service suites:$failed" >&2
          exit 1
        fi

  test:all:
    desc: Run tests including the slow scaffold gates
    cmds:
      - uv run pytest {{.TESTS}} -m "slow or not slow" {{.COV_PATHS}} --cov-report=term-missing

  test:integration:
    desc: Run Docker-backed integration tests (LocalStack via testcontainers), e.g. the ledger relay smoke (4.5)
    cmds:
      - uv run pytest {{.TESTED_PATHS}} --import-mode=importlib -m integration

  twenty:test:
    desc: Type check and run the Twenty app's vitest suite (packages/twenty-app; no server, no network)
    # The repo's first TypeScript package, deliberately contained: vitest only, no bundler,
    # no publishing. `npm ci` reproduces from the committed root package-lock.json and is
    # skipped when node_modules is already present, so a repeat run is just the suite.
    # Reached from `check` (task 3.4), which is why main.yml's quality job sets node up
    # before running it — a `check` that shells out to npm on a runner without node is red
    # CI (docs/ci-lessons.md). tests/test_twenty_app_scaffold.py pins both halves together.
    cmds:
      - '[ -d node_modules ] || npm ci'
      - npm run typecheck --workspace=@pulse/twenty-app
      - npm run test --workspace=@pulse/twenty-app

  # --- 5. Demo ---
  # The roadmap's demo breakpoints (design/delivery/pulse-program-roadmap.md #Demo breakpoints),
  # one target per demo. None is reached from `check`: 1 needs Docker/LocalStack, 2 includes a
  # script the roadmap convention keeps out of `check` on principle even though it is fully
  # offline, 3-4 are live-only against dev credentials — same posture as twenty:deploy and
  # relay:run — and 5 (the one-patient walk, pulse-demo-closeout) needs Docker/LocalStack offline
  # (`demo:e2e`) or dev ledger/Twenty/Snowflake credentials live (`demo:e2e:live`).
  # tests/test_demo_taskfile_targets.py (the reachability gate, same pattern as
  # test_credentialed_twenty_targets_stay_out_of_check) pins every demo:* target out of `check`;
  # each script's own smoke-parse test under tests/ keeps it importable under `check` regardless.

  demo:1:
    desc: "Demo 1 — Phase 1 breakpoint: LocalStack ledger commit/replay/fold round trip"
    cmds:
      - uv run python scripts/demo/demo1_ledger_core.py

  demo:2:
    desc: "Demo 2 — Phase 2 breakpoint: identity resolution, then the signed kanban drag ingress"
    cmds:
      - uv run python scripts/demo/demo2_identity_matcher.py
      - uv run python scripts/demo/demo2_kanban_drag.py

  demo:3:
    desc: "Demo 3 — Phase 3 breakpoint: the live kanban round trip against dev Twenty (needs dev credentials)"
    cmds:
      - uv run python scripts/demo/demo3_live_kanban_drag.py --target dev

  demo:4:
    desc: "Demo 4 — Phase 4 breakpoint: live declare-back against the dev mart and ledger (needs dev credentials)"
    cmds:
      - uv run python scripts/demo/demo4_billing_declare_back.py --target dev

  demo:e2e:
    desc: "Demo 5 — one patient, six stages, offline (needs Docker/LocalStack; docs/runbooks/demo5-end-to-end.md)"
    cmds:
      - uv run python scripts/demo/demo5_end_to_end.py

  demo:e2e:live:
    desc: "Demo 5 — the same six stages against dev (needs dev ledger/Twenty/Snowflake credentials; docs/runbooks/demo5-end-to-end.md)"
    cmds:
      - uv run python scripts/demo/demo5_end_to_end.py --live {{.CLI_ARGS}}

  stage:e2e:live:
    desc: "Demo 5 live, staged: source the scratch env, derive DEMO5_SNOWFLAKE_*, fetch the two Duplo tokens, preflight (image, schema head, seeded card), then demo:e2e:live"
    # One bash process, because go-task runs each cmd in its own shell and the exports must
    # reach the demo. `task stage:e2e:live -- --no-preflight` skips the preflight.
    cmds:
      - bash scripts/demo/stage_e2e_live.sh {{.CLI_ARGS}}

  # --- 6. Gate ---

  twenty:validate:
    desc: Validate the committed Twenty artifact — schema, staleness, UID map, options, TS parity
    # Reached from `check` (unlike twenty:gen/test/deploy) because it is Python-only by
    # construction: the generated TypeScript is compared by parsing it as data, never by
    # shelling out to npm, so this stays green on a runner with no node (docs/ci-lessons.md).
    # Reads three committed files and writes nothing — the drift it catches is fixed by
    # `task twenty:gen`, never by this target.
    cmds:
      - uv run python -m pulse_core.twenty_validate

  catalog:release:
    desc: Print the catalog release plan (deploy artifact; APPLY=1 executes, needs Snowflake creds)
    # The deploy artifact for merges to main touching catalog/** (.github/workflows/
    # catalog-release.yml), with the linear:sync posture: plan by default, `APPLY=1` is the only
    # way to mutate, and APPLY=1 without credentials is an error rather than a silent no-op.
    # Never reached from `check` — the check contract stays credential-free
    # (tests/test_catalog_release_deploy.py pins both).
    cmds:
      - uv run python -m pulse_core.catalog_release_cli {{if .APPLY}}--apply{{end}}

  snowflake:stg-events:
    desc: Apply the STG_EVENTS.EVENTS view DDL to Snowflake (idempotent CREATE OR REPLACE; needs Snowflake credentials)
    # snowflake-projection task 1.1: the committed shape is the reviewable artifact
    # (packages/ocean/infra/snowflake/stg_events_events.sql); this target just replays it.
    # CREATE OR REPLACE VIEW makes a re-run a no-op, so there is no plan/apply split like
    # catalog:release's. Never reached from `check` — CI has no Snowflake credentials
    # (docs/contracts/consumes.md posture); same guard as catalog:release above.
    dir: packages/ocean
    cmds:
      - uv run python scripts/apply_snowflake_view.py infra/snowflake/stg_events_events.sql

  synthea:regen:
    desc: Regenerate the PROFILE synthetic population from the pinned JAR and verify its manifest (Java required; REPIN=1 re-pins)
    # Deterministic generation receipted by checksum manifest (synthea-seed change). Java is a
    # prerequisite of this target only — never reached from `check`, which must stay green on
    # runners without Java (spec: "Regeneration is a task, never part of the check gate").
    # Divergence from the committed manifest exits nonzero naming the files; REPIN=1 is the
    # explicit re-pin path and its manifest diff is a reviewed change.
    requires:
      vars: [PROFILE]
    cmds:
      - uv run python -m synthea_seed.regen --profile {{.PROFILE}} {{if .REPIN}}--repin{{end}}

  twenty:deploy:
    desc: Replay the validated Twenty artifact against TARGET (dev|staging|prod; needs that target's credential)
    # Dumb by design: reads a validated artifact file and a target, replays the operation set
    # idempotently (create-if-absent keyed on universalIdentifier, update-if-drifted, never
    # delete), emits a receipt of operation counts. Zero generation logic — promotion is the
    # same file, next target. URL and credential resolve from the environment, never code.
    # Never reached from `check`: it needs credentials, same posture as catalog:release.
    requires:
      vars: [TARGET]
    cmds:
      - uv run python -m pulse_core.twenty_deploy --target {{.TARGET}}

  twenty:verify:
    desc: Verify the deployed Twenty artifact by read-back against TARGET (dev|staging|prod; needs that target's credential)
    # The 4.1 verification receipt: every artifact operation present on the target under its
    # mapped universalIdentifier, then a re-apply asserting all no-ops. Exits nonzero on any
    # mismatch; the printed receipt (names, counts, checksum — no workspace data) is the
    # artifact to attach. Live-only, so never reached from `check` — same posture as
    # twenty:deploy.
    requires:
      vars: [TARGET]
    cmds:
      - uv run python -m pulse_core.twenty_verify --target {{.TARGET}}

  twenty:verify:live:
    desc: Run the five projection cases against TARGET's live server (dev|staging|prod; needs that target's credential)
    # The 4.2 verification receipt: the same five cases the unit suite runs with a faked client,
    # run against a live server with the real one, so a projection defect that only appears
    # against real SELECT storage, real relation columns, or real defaults is caught. Exits
    # nonzero on any failed assertion; the JSON the run prints (case names, outcome statuses,
    # catalog values — no record ids, no response bodies) is the artifact to attach. Its fixtures
    # are synthetic and namespaced per run, and the run deletes them again.
    # Live-only, so never reached from `check` — same posture as twenty:deploy and twenty:verify.
    # The suite lives behind its own vitest config for the same reason: `task check`'s runner
    # includes tests/ and cannot collect it.
    requires:
      vars: [TARGET]
    env:
      PULSE_LIVE_TARGET: "{{.TARGET}}"
    cmds:
      - '[ -d node_modules ] || npm ci'
      - npm run test:live --workspace=@pulse/twenty-app

  twenty:seed:
    desc: Load the committed synthetic seed projection into TARGET (dev|staging|prod; needs that target's credential)
    # Reads the committed, checksummed projection (pulse_core/generated/twenty_seed_dev.json) and
    # upserts it idempotently — create-if-absent and patch-if-drifted on natural keys, never
    # delete — chunked and paced to the instance's limits. No generator toolchain: the projection
    # is the source, so seeding reproduces from a fresh clone. Target URL and credential resolve
    # from the environment (twenty:deploy's resolution, reused verbatim). Never reached from
    # `check`: it needs credentials, same posture as twenty:deploy and catalog:release.
    requires:
      vars: [TARGET]
    cmds:
      - uv run python -m pulse_core.twenty_seed --target {{.TARGET}}

  twenty:key:rotate:
    desc: Rotate TARGET's Twenty API key in the env file, the pulse-ledger Duplo secret, and the running API (dev; needs Duplo and cluster credentials)
    # Attended, credentialed, prompts for the new key without echo: the one key lives in three
    # places (operator env file, two Duplo secret keys, the API pod's envFrom) and rotating one
    # without the others leaves the demo tooling and the API disagreeing about which key is
    # live — how the 2026-09-02 Demo 5 run found every dev Twenty call 403ing. Never reached from
    # `check`, same posture as twenty:deploy and twenty:seed.
    requires:
      vars: [TARGET]
    cmds:
      - bash scripts/pulse-ledger/rotate_twenty_key.sh {{.TARGET}}

  twenty:app:build:
    desc: Build the Twenty app and its generated API client against TARGET (dev|staging|prod; needs that target's remote)
    # `twenty dev:build` generates the typed API client from the active remote, so even the
    # build half of the SDK toolchain is credentialed — hence TARGET, and hence never reached
    # from `check` (tests/test_twenty_app_scaffold.py pins it out, same posture as
    # twenty:deploy). The remote must exist first: run `twenty:app:publish` once, or add it by
    # hand with the remote:add line that target runs.
    #
    # `node_modules/.bin/twenty` after an unconditional `npm ci`, never `npx twenty`: the npm
    # name `twenty` is squatted (an IP-geolocation tool), and npx silently falls back to it
    # whenever the local bin is missing — a stale node_modules that predates the twenty-sdk
    # dependency passes the `[ -d node_modules ]` guard and still has no local bin (7.2).
    requires:
      vars: [TARGET]
    cmds:
      - npm ci
      - node_modules/.bin/twenty --remote {{.TARGET}} dev:build packages/twenty-app

  twenty:app:publish:
    desc: Build and publish the Twenty app to TARGET's server registry (dev|staging|prod; needs that target's credential)
    # Publishes to the server registry (--private), never npm. The remote is (re-)added
    # non-interactively first, resolving URL and credential from the same environment surface
    # as twenty:deploy (`PULSE_TWENTY_<TARGET>_URL` / `PULSE_TWENTY_<TARGET>_TOKEN`) — the CLI
    # writes them into a per-user config file, which is exactly why this is a developer/CD
    # step and never reached from `check`. The server rejects an equal or lower semver, so
    # bump `version` in packages/twenty-app/package.json in the same change as the model edit
    # being published — the failed publish names the version, not the cause.
    # Same npx hazard as twenty:app:build: the local bin or nothing.
    requires:
      vars: [TARGET]
    cmds:
      - npm ci
      - node_modules/.bin/twenty remote:add --as {{.TARGET}} --url "$PULSE_TWENTY_{{upper .TARGET}}_URL" --api-key "$PULSE_TWENTY_{{upper .TARGET}}_TOKEN"
      - node_modules/.bin/twenty app:publish --private --remote {{.TARGET}} packages/twenty-app

  ledger:image:
    desc: Build the pulse-ledger service image (API + relay, one image) and tag it TAG (needs Docker)
    # Build context is the repo root — pulse-core is a workspace sibling that
    # packages/pulse-ledger/Dockerfile installs from a sibling path, not from PyPI. The image runs
    # `python -m pulse_ledger.api_server` by default; a relay deployment overrides the command with
    # `python -m pulse_ledger.relay_worker` (same image, task 4.5's other process).
    # Never reached from `check`: it needs a Docker daemon and, on an arm64 dev machine, an
    # emulated amd64 build — neither belongs on every runner (tests/test_ledger_deploy_targets.py
    # pins this the same way tests/test_catalog_release_deploy.py pins catalog:release).
    requires:
      vars: [TAG]
    cmds:
      - docker buildx build --platform linux/amd64 -f packages/pulse-ledger/Dockerfile -t pulse-ledger:{{.TAG}} .

  ledger:migrate:
    desc: Run the ledger's Alembic migrations to head against DATABASE_URL (needs a real Postgres)
    # The same sequence `test_migration_000*.py` exercises against a throwaway cluster; this is
    # the deploy-time invocation against the real one. Never reached from `check`, which never
    # touches a live database (this repo's no-live-network posture).
    dir: packages/pulse-ledger/infra/postgres
    cmds:
      - uv run --project ../.. alembic upgrade head

  billing:migrate:
    desc: Run the billing engine's Alembic migrations to head against DATABASE_URL (needs a real Postgres)
    # The same sequence `test_migration_0001.py` exercises against a throwaway cluster; this is
    # the deploy-time invocation against the real one — its own database (`billing_engine`),
    # never the ledger's (design.md decision 5). Never reached from `check`, which never touches
    # a live database (this repo's no-live-network posture).
    dir: packages/billing/infra/postgres
    cmds:
      - uv run --project ../.. alembic upgrade head

  ledger:deploy:
    desc: Roll the pulse-ledger API/relay deployment to TAG on TARGET (needs that target's credential)
    # Dumb by design, same posture as twenty:deploy: push the image `ledger:image` already built,
    # then re-point TARGET's deployment at TAG. No generation logic lives here.
    # Never reached from `check`: it needs registry and cluster credentials.
    requires:
      vars: [TAG, TARGET]
    cmds:
      - docker push pulse-ledger:{{.TAG}}

  billing-connector:image:
    desc: Build the billing-connector service image and tag it TAG (needs Docker)
    # Build context is the repo root — pulse-core and billing are workspace siblings that
    # packages/billing-connector/Dockerfile installs from sibling paths, not from PyPI. The image
    # runs `python -m billing_connector.service` (task 2.3's consume loop).
    # Never reached from `check`: it needs a Docker daemon and, on an arm64 dev machine, an
    # emulated amd64 build — neither belongs on every runner
    # (tests/test_billing_connector_deploy_targets.py pins this the same way
    # tests/test_ledger_deploy_targets.py pins ledger:image).
    requires:
      vars: [TAG]
    cmds:
      - docker buildx build --platform linux/amd64 -f packages/billing-connector/Dockerfile -t billing-connector:{{.TAG}} .

  billing-connector:deploy:
    desc: Roll the billing-connector deployment to TAG on TARGET (needs that target's credential)
    # Dumb by design, same posture as ledger:deploy: push the image billing-connector:image
    # already built, then re-point TARGET's deployment at TAG. No generation logic lives here.
    # Never reached from `check`: it needs registry and cluster credentials.
    requires:
      vars: [TAG, TARGET]
    cmds:
      - docker push billing-connector:{{.TAG}}

  projection:consume:
    desc: Run the Twenty board projection consumer against TARGET's queue (dev|staging|prod; needs that target's credential)
    # Credentialed and long-running: resolves the queue and Twenty REST credential from the
    # environment (task 2.3's wiring), so it is never reached from `check` — same posture as
    # twenty:deploy. tests/test_twenty_app_scaffold.py asserts it stays out;
    # tests/test_twenty_projection_scaffold.py pins the TARGET requirement.
    requires:
      vars: [TARGET]
    cmds:
      - uv run python -m twenty_projection.consumer --target {{.TARGET}}

  projection:rebuild:
    desc: Repaint the Twenty board projection for SCOPE from the ledger's committed events (dev|staging|prod; needs that target's credentials)
    # The operator drill, not a demo trick (pulse-demo-closeout design decision 4): reads the
    # scope's committed events through the ledger's replay route, folds them through the same
    # apply handler the consumer uses, writes only differences, and prints a counted receipt
    # attributable to OPERATOR. Safe to re-run: a projection already matching the journal is a
    # zero-write, zero-difference run.
    # Credentialed on both sides — the projection's Twenty token and the kit's replay credential —
    # so it is never reached from `check`, same posture as projection:consume.
    # SCOPE is `<subject_type>[:<key>]`, e.g. `enrollment` or `enrollment:<canonical-id>`.
    requires:
      vars: [TARGET, SCOPE, OPERATOR]
    cmds:
      - uv run python -m twenty_projection.rebuild --target {{.TARGET}} --scope {{.SCOPE}} --operator {{.OPERATOR}}

  relay:run:
    desc: Run one verdict-relay poll against TARGET's mart and ledger (dev|staging|prod; needs that target's credentials)
    # The operator-facing invocation of the relay's production wiring (billing-state task 3.2,
    # spec verdict-relay-trigger). Dumb by design, same posture as twenty:deploy: no logic here,
    # just the schedules-package poll entry task 3.1 already wired
    # (`schedules.cli verdict-relay-poll`), so the scheduled poll and a manual run share one
    # production path and one receipt. Safe to re-run: a cursor already at the mart's watermark
    # is a no-op run — zero declarations, all-zero receipt, exit zero.
    # TARGET names which environment's credentials are loaded, exactly as ledger:deploy uses it.
    # The variable names themselves are target-agnostic on purpose (`VERDICT_RELAY_*`, pinned in
    # verdict_relay.production, values only in the deploy environment), so the target does not
    # enumerate them here; a missing one fails startup naming that variable, before any
    # connection.
    # Never reached from `check`, which stays offline and credential-free:
    # tests/test_verdict_relay_run_target.py pins both halves, and the target is on
    # test_twenty_app_scaffold.py's credentialed-reachability list.
    requires:
      vars: [TARGET]
    cmds:
      - uv run python -m schedules.cli verdict-relay-poll

  # `check` is the contract between a developer's machine and CI:
  # .github/workflows/main.yml invokes exactly this target. Keep it CI-safe — openspec and
  # openlore are npm globals that runners do not install, so they belong in `verify`, not here.
  # Node is different: main.yml's quality job installs it with a pinned setup-node step, so
  # twenty:test is CI-safe by that provision rather than by needing no toolchain (task 3.4).
  check:
    desc: All CI gates — lint, typecheck, tests, Twenty app suite, docs build (what main.yml runs)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: twenty:validate
      - task: twenty:test
      - task: workflow:lint
      - task: docs:lock-guard
      - task: docs:build

  pre-commit:
    desc: Run all pre-commit hooks
    cmds:
      - uv run pre-commit run --all-files

  verify:
    desc: Full local gate — check plus drift and spec validation (needs CHANGE)
    cmds:
      - task: check
      - task: workflow:lint:linear
      - task: lore:drift
      - task: spec:validate

  # --- 7. Docs ---

  docs:
    desc: Serve MkDocs locally
    cmds:
      - uv run mkdocs serve

  docs:build:
    desc: Build the docs strictly (what CI runs)
    cmds:
      - uv run mkdocs build -s

  docs:lock-guard:
    desc: Fail if the lock drifted from pyproject or contains mkdocs-successor forks (DNA-782)
    # MkDocs upstream is fractured — v2 is an incompatible rewrite that may ship under the same
    # PyPI name, and some plugin releases pull successor forks (properdocs, zensical)
    # transitively. pyproject.toml caps the majors; this guards the resolved lock.
    cmds:
      - uv lock --check
      - '! grep -Eq ''name = "(properdocs|zensical)"'' uv.lock'

  # --- 8. Spec lifecycle (OpenSpec) ---
  # Alphabetical, per the listing convention. Workflow order is init, validate, status, archive.

  spec:archive:
    desc: Archive a completed OpenSpec change (merges deltas to main specs)
    deps: [spec:validate, lore:drift, test]
    cmds:
      - openspec archive {{.CHANGE}}

  spec:init:
    desc: Initialize OpenSpec in this project
    cmds:
      - openspec init --tools claude

  spec:status:
    desc: Show OpenSpec change status
    cmds:
      - openspec status --change {{.CHANGE}}

  spec:validate:
    desc: Validate the current OpenSpec change
    cmds:
      - openspec validate {{.CHANGE}}

  # --- 9. Drift and memory (OpenLore) ---

  lore:analyze:
    desc: Build call graph and structural digest
    cmds:
      - openlore analyze

  lore:drift:
    desc: Detect spec/code drift
    cmds:
      - openlore drift

  lore:mcp:
    desc: Start OpenLore MCP server (for agent orient() calls)
    cmds:
      - openlore mcp

  # --- 10. Work distribution (thin glue) ---
  # Alphabetical, per the listing convention. The pipeline runs dispatch, collect, sync-docs.

  checkoff:
    desc: Flip tasks.md checkboxes for merged tasks (needs CHANGE; COMMIT=1 to commit; COMMIT_SHA=<sha> to record one merge)
    cmds:
      - uv run python scripts/checkoff_tasks.py --change {{.CHANGE}} {{if .COMMIT}}--commit{{end}} {{if .COMMIT_SHA}}--commit-sha {{.COMMIT_SHA}}{{end}}

  collect:
    desc: Collect HANDOFF.md files from Orca worktrees (needs CHANGE)
    cmds:
      - uv run python scripts/collect_handoffs.py --change {{.CHANGE}}

  dispatch:
    desc: Parse OpenSpec tasks.md and emit work-order files (needs CHANGE)
    cmds:
      - uv run python scripts/dispatch_tasks.py --change {{.CHANGE}}

  replan:
    desc: Validate a tasks.md amendment — delta plan-validation checks + spec validation, no human gate (needs CHANGE)
    # openspec is an npm global CI runners do not have, so this stays out of `check`, like verify.
    cmds:
      - uv run python scripts/dispatch_tasks.py --change {{.CHANGE}} --validate-only
      - openspec validate {{.CHANGE}}

  linear:sync:
    desc: Project tasks.md into Linear issues (needs CHANGE; plan only unless APPLY=1)
    # Dry run by default: this writes to a shared system, and the plan it prints is the plan
    # it would apply. `task linear:sync CHANGE=x APPLY=1` performs the mutations.
    cmds:
      - uv run python scripts/linear_sync.py --change {{.CHANGE}} {{if .APPLY}}--apply{{end}}

  workflow:lint:
    desc: Validate WORKFLOW.md's executable YAML block (offline; part of `check`)
    cmds:
      - uv run python scripts/workflow.py lint

  workflow:lint:linear:
    desc: workflow:lint plus live Linear team/project/status checks (needs Linear auth)
    cmds:
      - uv run python scripts/workflow.py lint --linear

  workflow:show:
    desc: Dump WORKFLOW.md's parsed workflow block as JSON
    cmds:
      - uv run python scripts/workflow.py show

  sync-docs:
    desc: Run drift checks and print doc-updater instructions (needs CHANGE)
    cmds:
      - openlore drift
      - openspec validate {{.CHANGE}}
      - echo "Review handoffs/ for plan-relevant updates"
      - 'echo "Apply via: edit openspec/changes/{{.CHANGE}}/specs/ then openspec validate {{.CHANGE}}"'

  # --- 11. DevEx loop ---
  # The inner tier of the DevEx loop (docs/process/devex-audit/README.md). devex:check counts open
  # audit findings from tests/scaffold/cat10_devex.py and freezes the audit protocol; it never
  # prints a 0-10. The 0-10 comes from the LLM-judged audit, which devex:audit prepares but cannot
  # run: three agents under Orca orchestration, coordinated by the session that says /devex-audit.

  devex:check:
    desc: Count open DevEx audit findings (METRIC devex_open_findings) and verify the frozen audit protocol
    cmds:
      - uv run python scripts/devex/check.py

  devex:audit:
    desc: Print the DevEx audit runbook and today's report paths (the audit itself runs via /devex-audit)
    cmds:
      - uv run python scripts/devex/check.py --prep-audit

  # --- 12. Template updates (generated repos) ---

  template:diff:
    desc: Show ADE template changes since this repo was generated
    cmds:
      - bash scripts/template_sync.sh diff

  template:sync:
    desc: Apply ADE template changes to infrastructure paths (never README/CLAUDE/src)
    cmds:
      - bash scripts/template_sync.sh apply
