version: "3"

# Tasks are grouped by functional area, areas ordered by when you reach them, and alphanumeric
# within each area. `task -l` sorts alphabetically and would scatter that grouping, so the
# default task lists with --sort none to preserve it.
#
# Two lifecycles share this file, because a generated repo inherits it verbatim:
#   - area 1 runs in the TEMPLATE only, and is where a project begins;
#   - areas 2-9 run in whichever repo you are sitting in;
#   - area 10 runs in a GENERATED repo, periodically, to pull template fixes back down.

vars:
  APP: pkg_pulse
  SRC: src
  TESTS: tests
  # Lint reaches the absorbed package; typecheck and test do not yet. These are separate vars so
  # each target's scope is readable at the point of use — a var that names packages/ocean while
  # the command runs against src is a false claim about what CI verifies (task 1.3).
  LINT_PATHS: src tests packages/archaeology packages/pulse-ledger packages/pulse-core packages/verdict-relay packages/schedules packages/identity packages/consent-ingress packages/synthea-seed packages/ocean
  # Typecheck reaches ocean's libs but not its 16 services (task 1.4, DNA-779): the services
  # carry 217 mypy errors. Stated here rather than implied, so what CI verifies is readable
  # from this file.
  # schedules, identity, and consent-ingress typecheck under pyright strict (task 1.1, S1.1
  # task 1.1), same as verdict-relay — see typecheck, not this mypy list.
  TYPED_PATHS: src packages/pulse-ledger/src packages/pulse-core/src packages/ocean/libs/ocean-events/src packages/ocean/libs/ocean-broker/src packages/ocean/libs/ocean-connector-mcp/src
  # Tests reach ocean's libs here; the 14 service suites run in test:services, one pytest
  # process per service (task 4.14, DNA-781). They cannot join this list: every service ships a
  # top-level `src` package and imports itself as `from src.X`, and one interpreter cannot hold
  # sixteen different `src` packages in sys.modules. graph-projection moved from this list into
  # the loop with the rest. tests/test_taskfile_test_coverage.py pins this arrangement.
  TESTED_PATHS: tests packages/archaeology/tests packages/pulse-ledger/tests packages/pulse-core/tests packages/verdict-relay/tests packages/schedules/tests packages/identity/tests packages/consent-ingress/tests packages/synthea-seed/tests packages/ocean/libs
  # Coverage covers ocean-events because it is the envelope every consumer depends on, and it is
  # at 100%. ocean-broker joins it at task 2.2: the reason it was excluded — that 2.2 would throw
  # its tests away — expired when 2.2 landed EventBridgePublisher and the event catalog, which are
  # what the library now is. Its config.py is the Kafka half, low-covered and deleted by task 9.2.
  # ocean-connector-mcp is outside this migration, still at 0%, tracked in DNA-779.
  # The pulse packages are covered from their first commit — placeholder-sized today, and the
  # 80% floor applies as they grow rather than being retrofitted later.
  # verdict-relay and schedules each carry their own 85% floor (s12-verdict-relay, s13-schedules);
  # identity carries a 90% floor (s14-identity — wrong matches are the costliest bug in the
  # system); consent-ingress carries an 85% floor (S1.1 task 1.1, same tier as verdict-relay and
  # schedules). Each is enforced by the extra `coverage report` steps in `test` — the global
  # fail_under cannot express a per-package floor.
  COV_PATHS: --cov=src/pkg_pulse --cov=packages/archaeology/src --cov=packages/pulse-ledger/src --cov=packages/pulse-core/src --cov=packages/verdict-relay/src --cov=packages/schedules/src --cov=packages/identity/src --cov=packages/consent-ingress/src --cov=packages/synthea-seed/src --cov=packages/ocean/libs/ocean-events/src --cov=packages/ocean/libs/ocean-broker/src
  CHANGE: ""
  VISIBILITY: --private

tasks:
  default:
    desc: List tasks grouped by area (alphabetical listing is `task -l`)
    silent: true
    cmds:
      - task --list-all --sort none

  # --- 1. Create (template only) ---

  new-repo:
    desc: Create a new repo from this template (NAME, PKG, DESC; created beside this repo)
    # new-repo.sh runs `gh repo create --clone`, which clones into the current directory. Run
    # from the repo root it would nest the new project inside the template, so the task runs one
    # level up and calls the script by absolute path.
    # Usage: task new-repo NAME=my-project PKG=my_project DESC="A cool new project"
    # Run it from inside this repo; the task moves to the parent itself.
    dir: '{{.ROOT_DIR}}/..'
    requires:
      vars: [NAME, PKG, DESC]
    cmds:
      - |
        if [ -f "{{.ROOT_DIR}}/.ade-template-version" ]; then
          echo "This repo was generated from the ADE template — new-repo belongs in the template itself." >&2
          exit 1
        fi
        bash "{{.ROOT_DIR}}/new-repo.sh" "{{.NAME}}" "{{.PKG}}" "{{.DESC}}" {{.VISIBILITY}}

  # --- 2. Environment ---

  install:
    desc: Setup venv and install dependencies
    cmds:
      - uv sync --all-packages

  mcp:check:
    desc: MCP diagnostics — duplicate scopes, dead servers (see docs/mcp-servers.md)
    silent: true
    cmds:
      - |
        OUT=$(claude mcp list 2>&1); echo "$OUT"
        if echo "$OUT" | grep -q "defined in multiple scopes"; then
          echo "FAIL: MCP server duplicated across scopes — consolidate; per-endpoint OAuth tokens conflict"; exit 1
        fi
        if echo "$OUT" | grep -q "Failed to connect"; then
          echo "FAIL: an MCP server failed to connect — fix or remove it"; exit 1
        fi
        echo "MCP OK"

  # --- 3. Develop ---

  fmt:
    desc: Auto-format and apply fixable lint rules
    cmds:
      - uv run ruff format {{.LINT_PATHS}}
      - uv run ruff check --fix {{.LINT_PATHS}}

  lint:
    desc: Check formatting and lint rules (read-only)
    cmds:
      - uv run ruff format {{.LINT_PATHS}} --check
      - uv run ruff check {{.LINT_PATHS}}

  twenty:gen:
    desc: Regenerate the Twenty app's generated surfaces and the Metadata API operation-set artifact
    # Reads state_catalog.yaml, the model definition, and packages/twenty-app/uid-map.json;
    # writes packages/twenty-app/generated/ and artifact/operations.json. Pure file
    # transformation — no network, and no path that applies anything to a Twenty instance
    # (that is twenty:deploy). A UID the map lacks is an error naming the key, never a mint.
    cmds:
      - uv run python -m pulse_core.twenty_metadata

  typecheck:
    desc: Type check — mypy on TYPED_PATHS (DNA-779), pyright on verdict-relay (s12), schedules (s13), identity (s14), consent-ingress (S1.1 task 1.1), archaeology (bf0a)
    cmds:
      - uv run mypy {{.TYPED_PATHS}}
      # verdict-relay, schedules, identity, consent-ingress, and archaeology typecheck under
      # pyright strict (s12-verdict-relay, s13-schedules, s14-identity, S1.1 task 1.1,
      # bf0a-archaeology-access); pyright is a dev dependency of each package, installed by
      # `uv sync --all-packages`.
      - uv run pyright -p packages/archaeology
      - uv run pyright -p packages/verdict-relay
      - uv run pyright -p packages/schedules
      - uv run pyright -p packages/identity
      - uv run pyright -p packages/consent-ingress
      - uv run pyright -p packages/synthea-seed

  # --- 4. Test ---

  test:
    desc: Run tests with coverage, then every ocean service suite (DNA-781)
    cmds:
      - uv run pytest {{.TESTED_PATHS}} --import-mode=importlib {{.COV_PATHS}} --cov-report=term-missing
      # verdict-relay's, schedules's, and consent-ingress's per-package 85% floors
      # (s12-verdict-relay, s13-schedules, S1.1 task 1.1), and identity's 90% floor
      # (s14-identity), read from the combined run's coverage data — no second test run. The
      # flag overrides the global fail_under.
      - uv run coverage report --include="packages/verdict-relay/src/*" --fail-under=85
      - uv run coverage report --include="packages/schedules/src/*" --fail-under=85
      - uv run coverage report --include="packages/identity/src/*" --fail-under=90
      - uv run coverage report --include="packages/consent-ingress/src/*" --fail-under=85
      - task: test:services

  test:services:
    desc: Run each ocean service's tests, one pytest process per service
    # One process per service because each ships a top-level `src` package imported as
    # `from src.X` — the suites cannot share an interpreter (see TESTED_PATHS note). Services
    # stay outside the coverage floor (DNA-779). Every failing suite is reported, not just the
    # first. mongodb-connector and warehouse-sync have no tests directory to run — a gap in
    # those services, tracked by tests/test_taskfile_test_coverage.py.
    cmds:
      - |
        failed=""
        for dir in packages/ocean/services/*/tests; do
          echo "=== ${dir%/tests}"
          uv run pytest "$dir" -q || failed="$failed ${dir%/tests}"
        done
        if [ -n "$failed" ]; then
          echo "FAILED service suites:$failed" >&2
          exit 1
        fi

  test:all:
    desc: Run tests including the slow scaffold gates
    cmds:
      - uv run pytest {{.TESTS}} -m "slow or not slow" {{.COV_PATHS}} --cov-report=term-missing

  test:integration:
    desc: Run Docker-backed integration tests (LocalStack via testcontainers), e.g. the ledger relay smoke (4.5)
    cmds:
      - uv run pytest {{.TESTED_PATHS}} --import-mode=importlib -m integration

  twenty:test:
    desc: Type check and run the Twenty app's vitest suite (packages/twenty-app; no server, no network)
    # The repo's first TypeScript package, deliberately contained: vitest only, no bundler,
    # no publishing. `npm ci` reproduces from the committed root package-lock.json and is
    # skipped when node_modules is already present, so a repeat run is just the suite.
    # Not part of `check` yet — that needs a pinned setup-node step in main.yml to land in
    # the same commit, or `check` shells out to npm on a runner with no node.
    cmds:
      - '[ -d node_modules ] || npm ci'
      - npm run typecheck --workspace=@pulse/twenty-app
      - npm run test --workspace=@pulse/twenty-app

  # --- 5. Gate ---

  catalog:release:
    desc: Print the catalog release plan (deploy artifact; APPLY=1 executes, needs Snowflake creds)
    # The deploy artifact for merges to main touching catalog/** (.github/workflows/
    # catalog-release.yml), with the linear:sync posture: plan by default, `APPLY=1` is the only
    # way to mutate, and APPLY=1 without credentials is an error rather than a silent no-op.
    # Never reached from `check` — the check contract stays credential-free
    # (tests/test_catalog_release_deploy.py pins both).
    cmds:
      - uv run python -m pulse_core.catalog_release_cli {{if .APPLY}}--apply{{end}}

  synthea:regen:
    desc: Regenerate the PROFILE synthetic population from the pinned JAR and verify its manifest (Java required; REPIN=1 re-pins)
    # Deterministic generation receipted by checksum manifest (synthea-seed change). Java is a
    # prerequisite of this target only — never reached from `check`, which must stay green on
    # runners without Java (spec: "Regeneration is a task, never part of the check gate").
    # Divergence from the committed manifest exits nonzero naming the files; REPIN=1 is the
    # explicit re-pin path and its manifest diff is a reviewed change.
    requires:
      vars: [PROFILE]
    cmds:
      - uv run python -m synthea_seed.regen --profile {{.PROFILE}} {{if .REPIN}}--repin{{end}}

  twenty:deploy:
    desc: Replay the validated Twenty artifact against TARGET (dev|staging|prod; needs that target's credential)
    # Dumb by design: reads a validated artifact file and a target, replays the operation set
    # idempotently (create-if-absent keyed on universalIdentifier, update-if-drifted, never
    # delete), emits a receipt of operation counts. Zero generation logic — promotion is the
    # same file, next target. URL and credential resolve from the environment, never code.
    # Never reached from `check`: it needs credentials, same posture as catalog:release.
    requires:
      vars: [TARGET]
    cmds:
      - uv run python -m pulse_core.twenty_deploy --target {{.TARGET}}

  # `check` is the contract between a developer's machine and CI:
  # .github/workflows/main.yml invokes exactly this target. Keep it CI-safe — openspec and
  # openlore are npm globals that runners do not install, so they belong in `verify`, not here.
  check:
    desc: All CI gates — lint, typecheck, tests, docs build (what main.yml runs)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: workflow:lint
      - task: docs:lock-guard
      - task: docs:build

  pre-commit:
    desc: Run all pre-commit hooks
    cmds:
      - uv run pre-commit run --all-files

  verify:
    desc: Full local gate — check plus drift and spec validation (needs CHANGE)
    cmds:
      - task: check
      - task: workflow:lint:linear
      - task: lore:drift
      - task: spec:validate

  # --- 6. Docs ---

  docs:
    desc: Serve MkDocs locally
    cmds:
      - uv run mkdocs serve

  docs:build:
    desc: Build the docs strictly (what CI runs)
    cmds:
      - uv run mkdocs build -s

  docs:lock-guard:
    desc: Fail if the lock drifted from pyproject or contains mkdocs-successor forks (DNA-782)
    # MkDocs upstream is fractured — v2 is an incompatible rewrite that may ship under the same
    # PyPI name, and some plugin releases pull successor forks (properdocs, zensical)
    # transitively. pyproject.toml caps the majors; this guards the resolved lock.
    cmds:
      - uv lock --check
      - '! grep -Eq ''name = "(properdocs|zensical)"'' uv.lock'

  # --- 7. Spec lifecycle (OpenSpec) ---
  # Alphabetical, per the listing convention. Workflow order is init, validate, status, archive.

  spec:archive:
    desc: Archive a completed OpenSpec change (merges deltas to main specs)
    deps: [spec:validate, lore:drift, test]
    cmds:
      - openspec archive {{.CHANGE}}

  spec:init:
    desc: Initialize OpenSpec in this project
    cmds:
      - openspec init --tools claude

  spec:status:
    desc: Show OpenSpec change status
    cmds:
      - openspec status --change {{.CHANGE}}

  spec:validate:
    desc: Validate the current OpenSpec change
    cmds:
      - openspec validate {{.CHANGE}}

  # --- 8. Drift and memory (OpenLore) ---

  lore:analyze:
    desc: Build call graph and structural digest
    cmds:
      - openlore analyze

  lore:drift:
    desc: Detect spec/code drift
    cmds:
      - openlore drift

  lore:mcp:
    desc: Start OpenLore MCP server (for agent orient() calls)
    cmds:
      - openlore mcp

  # --- 9. Work distribution (thin glue) ---
  # Alphabetical, per the listing convention. The pipeline runs dispatch, collect, sync-docs.

  collect:
    desc: Collect HANDOFF.md files from Orca worktrees (needs CHANGE)
    cmds:
      - uv run python scripts/collect_handoffs.py --change {{.CHANGE}}

  dispatch:
    desc: Parse OpenSpec tasks.md and emit work-order files (needs CHANGE)
    cmds:
      - uv run python scripts/dispatch_tasks.py --change {{.CHANGE}}

  linear:sync:
    desc: Project tasks.md into Linear issues (needs CHANGE; plan only unless APPLY=1)
    # Dry run by default: this writes to a shared system, and the plan it prints is the plan
    # it would apply. `task linear:sync CHANGE=x APPLY=1` performs the mutations.
    cmds:
      - uv run python scripts/linear_sync.py --change {{.CHANGE}} {{if .APPLY}}--apply{{end}}

  workflow:lint:
    desc: Validate WORKFLOW.md's executable YAML block (offline; part of `check`)
    cmds:
      - uv run python scripts/workflow.py lint

  workflow:lint:linear:
    desc: workflow:lint plus live Linear team/project/status checks (needs Linear auth)
    cmds:
      - uv run python scripts/workflow.py lint --linear

  workflow:show:
    desc: Dump WORKFLOW.md's parsed workflow block as JSON
    cmds:
      - uv run python scripts/workflow.py show

  sync-docs:
    desc: Run drift checks and print doc-updater instructions (needs CHANGE)
    cmds:
      - openlore drift
      - openspec validate {{.CHANGE}}
      - echo "Review handoffs/ for plan-relevant updates"
      - 'echo "Apply via: edit openspec/changes/{{.CHANGE}}/specs/ then openspec validate {{.CHANGE}}"'

  # --- 10. Template updates (generated repos) ---

  template:diff:
    desc: Show ADE template changes since this repo was generated
    cmds:
      - bash scripts/template_sync.sh diff

  template:sync:
    desc: Apply ADE template changes to infrastructure paths (never README/CLAUDE/src)
    cmds:
      - bash scripts/template_sync.sh apply
