[project]
name = "pulse-core"
version = "0.1.0"
description = "PULSE client SDK — command submission, response classification, consume convention"
requires-python = ">=3.10,<4.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
