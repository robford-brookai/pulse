[project]
name = "pulse-core"
version = "0.1.0"
description = "PULSE client SDK — command submission, response classification, consume convention"
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    # `tests/test_twenty_metadata.py` runs the whole generator with sockets disabled, which is how
    # the "Generation is offline" scenario is asserted rather than assumed. Declared here so the
    # dependency travels with the suite that needs it, the same pattern identity and schedules use.
    "pytest-socket>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
