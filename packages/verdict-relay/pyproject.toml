[project]
name = "verdict-relay"
version = "0.1.0"
description = "PULSE verdict relay — reads the warehouse verdict mart, declares verdicts on the ledger's single write path"
requires-python = ">=3.10,<4.0"
dependencies = [
    # The cursor store's HTTP edge (mart_reader.LedgerCursorStore) — same floor pulse-core pins,
    # so the workspace resolves one httpx.
    "httpx>=0.28.1",
    # cursor_path / validate_cursor: the writer-state contract the durable cursor persists through.
    "pulse-core",
]

[tool.uv.sources]
pulse-core = { workspace = true }

[dependency-groups]
dev = [
    # Property tests for the as_of-monotonic ordering core (s12-verdict-relay design
    # decision 7). A dev dependency of this package only, per the change tasks.
    "hypothesis>=6.100",
    # Enforces the no-live-network posture. tests/conftest.py blocks sockets for every
    # run that collects this package, flag or no flag.
    "pytest-socket>=0.7.0",
    # This package typechecks under pyright (see [tool.pyright] below); `task typecheck`
    # runs it alongside the workspace mypy pass.
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
