[project]
name = "twenty-projection"
version = "0.1.0"
description = "PULSE ledger-fed Twenty board projection — committed ledger events upsert board records through the core REST surface, monotonically on (subject_id, ledger_seq)"
requires-python = ">=3.10,<4.0"
# No runtime dependencies yet: wave 1 (task 2.1/2.3) adds pulse-core for `pulse_core.consume`
# and command types. The scaffold ships the layout and the credentialed entrypoint only.
dependencies = []

[dependency-groups]
dev = [
    # Enforces the no-live-network posture (spec: every consumer/writer test runs against
    # fixture transports). tests/conftest.py blocks sockets for every run that collects this
    # package, flag or no flag — same pattern as verdict-relay, schedules, and consent-ingress.
    "pytest-socket>=0.7.0",
    # This package typechecks under pyright (see [tool.pyright] below); `task typecheck`
    # runs it alongside the workspace mypy pass.
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twenty_projection"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
