[project]
name = "call-simulator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "confluent-kafka==2.13.2",
    "pydantic>=2.0",
    "structlog==25.5.0",
    # Transport: the shared EventBridge publisher and the event catalog. confluent-kafka stays
    # until the consumer converts (task 5.3); sqlalchemy/asyncpg back the failed_webhooks DLQ.
    "ocean-broker",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
