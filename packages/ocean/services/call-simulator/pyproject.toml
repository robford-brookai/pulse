[project]
name = "call-simulator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    # confluent-kafka is no longer imported (the consumer converted to SQS in task 5.3);
    # it stays in the manifest until task 6.6 sweeps it from every package at once.
    "confluent-kafka==2.13.2",
    "pydantic>=2.0",
    "structlog==25.5.0",
    # Transport: the shared EventBridge publisher and the event catalog, boto3 for the SQS
    # consumer; sqlalchemy/asyncpg back the failed_webhooks DLQ.
    "boto3>=1.34",
    "ocean-broker",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
