[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "boto3>=1.34",
    "httpx>=0.28",
    "structlog==25.5.0",
    "ocean-events",
    "ocean-broker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
