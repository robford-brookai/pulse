[project]
name = "agent-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    # The SQS consumer's client; ocean-broker's EventBridge client shares the same core.
    "boto3>=1.42.0",
    "ocean-broker",
    # Imported directly to build the DLQ session maker; asyncpg is its driver.
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog==25.5.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
# ocean-broker is a path dependency inside the monorepo, not a PyPI package. The Dockerfile
# installs it from libs/ocean-broker; this is the same edge stated for local resolution.
ocean-broker = { path = "../../libs/ocean-broker" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
