[project]
name = "warehouse-sync"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "aioboto3>=13.0.0",
    "snowflake-connector-python==3.12.3",
    "cryptography>=43.0.0",
    "structlog==25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
