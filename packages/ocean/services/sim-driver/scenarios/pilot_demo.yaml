  - patient_id: "sim-pt-demo-008"
    clinic_id: "clinic-demo"
    source: pocar
    signals:
      - sim_hour: 0.35
        type: weight
        value: 95
        unit: kg
        anomalous: true
        severity_hint: HIGH

  - patient_id: "sim-pt-demo-009"
    clinic_id: "clinic-demo"
    source: impilo
    signals:
      - sim_hour: 0.40
        type: heart_rate
        value: 110
        unit: bpm
        anomalous: true
        severity_hint: HIGH
      - sim_hour: 0.45
        type: spo2
        value: 96
        unit: "%"
        anomalous: false
