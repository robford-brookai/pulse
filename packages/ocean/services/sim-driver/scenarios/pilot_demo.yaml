name: pilot_demo
description: "Pilot demo: 10 patients, 3 severity tiers (critical/urgent/high)"
compression_ratio: 960

patients:
  # --- CRITICAL severity (4 patients) ---

  - patient_id: "sim-pt-demo-001"
    clinic_id: "clinic-demo"
    source: pocar
    signals:
      - sim_hour: 0.05
        type: glucose
        value: 280
        unit: mg/dL
        anomalous: true
        severity_hint: CRITICAL
      - sim_hour: 0.35
        type: weight
        value: 81
        unit: kg
        anomalous: false

  - patient_id: "sim-pt-demo-002"
    clinic_id: "clinic-demo"
    source: pocar
    signals:
      - sim_hour: 0.08
        type: glucose
        value: 350
        unit: mg/dL
        anomalous: true
        severity_hint: CRITICAL

  - patient_id: "sim-pt-demo-003"
    clinic_id: "clinic-demo"
    source: impilo
    signals:
      - sim_hour: 0.10
        type: spo2
        value: 84
        unit: "%"
        anomalous: true
        severity_hint: CRITICAL

  - patient_id: "sim-pt-demo-010"
    clinic_id: "clinic-demo"
    source: pocar
    signals:
      - sim_hour: 0.50
        type: glucose
        value: 400
        unit: mg/dL
        anomalous: true
        severity_hint: CRITICAL

  # --- URGENT severity (3 patients) ---

  - patient_id: "sim-pt-demo-004"
    clinic_id: "clinic-demo"
    source: pocar
    signals:
      - sim_hour: 0.15
        type: glucose
        value: 195
        unit: mg/dL
        anomalous: true
        severity_hint: URGENT

  - patient_id: "sim-pt-demo-005"
    clinic_id: "clinic-demo"
    source: impilo
    signals:
      - sim_hour: 0.20
        type: spo2
        value: 90
        unit: "%"
        anomalous: true
        severity_hint: URGENT
      - sim_hour: 0.40
        type: heart_rate
        value: 72
        unit: bpm
        anomalous: false

  - patient_id: "sim-pt-demo-006"
    clinic_id: "clinic-demo"
    source: pocar
    signals:
      - sim_hour: 0.25
        type: glucose
        value: 210
        unit: mg/dL
        anomalous: true
        severity_hint: URGENT

  # --- HIGH severity (3 patients) ---

  - patient_id: "sim-pt-demo-007"
    clinic_id: "clinic-demo"
