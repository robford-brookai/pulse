[project]
name = "mongodb-connector"
version = "0.1.0"
description = "CDC watcher — MongoDB Change Streams to Kafka/Redpanda events"
requires-python = ">=3.13"
dependencies = [
    "motor>=3.3",
    "pymongo>=4.6",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "confluent-kafka>=2.3",
    "structlog>=24.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "ocean-events",
    "ocean-broker",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
