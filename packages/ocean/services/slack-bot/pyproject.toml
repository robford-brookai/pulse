[project]
name = "slack-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "confluent-kafka==2.13.2",
    "slack-bolt==1.27.0",
    "anthropic==0.84.0",
    "httpx>=0.28",
    "structlog==25.5.0",
    "ocean-events",
    "fastmcp>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
