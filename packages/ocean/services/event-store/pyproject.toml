[project]
name = "event-store"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "aioboto3>=13.0.0",
    "structlog==25.5.0",
    "ocean-events",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
