[project]
name = "ocean-connector-mcp"
version = "0.1.0"
description = "Base class for Ocean departmental connector MCP servers"
requires-python = ">=3.13"
dependencies = ["fastmcp>=3.1.0", "structlog>=25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_connector_mcp"]
