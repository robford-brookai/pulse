[project]
name = "ocean-events"
version = "0.1.0"
description = "Canonical Ocean event schema and entity models"
requires-python = ">=3.13"
dependencies = ["pydantic==2.12.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
