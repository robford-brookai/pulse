[project]
name = "ocean-broker"
version = "0.1.0"
description = "Event transport: EventBridge publisher, plus the Kafka config factory being retired"
requires-python = ">=3.13"
dependencies = [
    "aws-msk-iam-sasl-signer-python>=1.0.0",
    "structlog>=25.5.0",
    "boto3>=1.42.0",
    "sqlalchemy[asyncio]>=2.0.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_broker"]
