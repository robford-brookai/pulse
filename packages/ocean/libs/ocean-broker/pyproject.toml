[project]
name = "ocean-broker"
version = "0.1.0"
description = "Dual-mode Kafka broker config factory (Redpanda local / MSK Serverless)"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.13.0",
    "aws-msk-iam-sasl-signer-python>=1.0.0",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_broker"]
