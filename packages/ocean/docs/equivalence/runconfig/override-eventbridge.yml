# Compose override for the 8.2 equivalence run, EventBridge/LocalStack side.
# Used as: docker compose -p ocean-eb -f infra/docker-compose.yml -f docs/equivalence/runconfig/override-eventbridge.yml ...
# - Mounts the pinned persona roster over the baked-in AGENTS.md.
# - Forces ANTHROPIC_API_KEY empty so decide_with_fallback takes the
#   deterministic severity-rule path (CRITICAL -> approve) on every task.
# - Disables control-plane escalation: it fires on wall-clock timeouts, which
#   the gate does not compare, and a slow run would otherwise grow
#   task_escalation_state rows the other run lacks.
#
# The 8.2 run additionally had to set AWS_DEFAULT_REGION on every consumer:
# botocore resolves the region from that variable, not AWS_REGION, and the
# compose env then set only AWS_REGION, so every SQS consumer died silently
# at startup with NoRegionError. Task 6.7 moved that fix into the compose
# x-localstack-env anchor, so this override no longer carries it.
services:
  agent-worker:
    volumes:
      - ${PINNED_AGENTS_MD:?absolute path to AGENTS-pinned.md}:/app/AGENTS.md:ro
    environment:
      ANTHROPIC_API_KEY: ""
  control-plane:
    environment:
      ESCALATION_ENABLED: "false"
  slack-bot:
    environment:
      SLACK_BOT_TOKEN: ""
      ANTHROPIC_API_KEY: ""
  sim-driver:
    environment:
      SLACK_BOT_TOKEN: ""
      ANTHROPIC_API_KEY: ""
