[project]
name = "ocean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ocean-events",
    "ocean-broker",
    "pyyaml>=6.0.3",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]

[tool.uv.sources]
ocean-events = { workspace = true, editable = true }
ocean-broker = { workspace = true, editable = true }

[dependency-groups]
dev = [
    # alembic + psycopg2 are the sync pair the migration runner uses: infra/postgres/env.py
    # strips +asyncpg before handing the URL to alembic. Needed by the migration-chain test.
    "alembic>=1.18.0",
    # agent-worker and slack-bot import the Anthropic SDK, and slack-bot imports slack-bolt;
    # their suites run in `task test:services` against this root venv (task 4.14, DNA-781).
    "anthropic>=0.40.0",
    "slack-bolt>=1.27.0",
    # slack-bolt's AsyncApp does `from aiohttp import web` unconditionally.
    "aiohttp>=3.9",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "sqlalchemy>=2.0.48",
    "structlog>=25.5.0",
    "testcontainers[kafka,postgres]>=4.9.0",
    "uvicorn>=0.41.0",
    "requests>=2.32.0",
    "snowflake-connector-python>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring Docker (deselect with -m 'not integration')",
]
