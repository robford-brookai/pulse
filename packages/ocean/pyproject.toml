[project]
name = "ocean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ocean-events",
    "ruff>=0.15.5",
]

[tool.uv.workspace]
members = [
    "libs/ocean-events",
]

[tool.uv.sources]
ocean-events = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
