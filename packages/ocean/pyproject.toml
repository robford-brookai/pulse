[project]
name = "ocean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ocean-events",
    "ruff>=0.15.5",
]

[tool.uv.workspace]
members = [
    "libs/ocean-events",
]

[tool.uv.sources]
ocean-events = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "confluent-kafka>=2.13.2",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "sqlalchemy>=2.0.48",
    "structlog>=25.5.0",
    "testcontainers[kafka,postgres]>=4.9.0",
    "uvicorn>=0.41.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring Docker (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
