[project]
name = "pulse-ledger"
version = "0.1.0"
description = "PULSE ledger service — command API, ledger schema, outbox relay"
requires-python = ">=3.10,<4.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
