[project]
name = "billing"
version = "0.1.0"
description = "PULSE billing engine — event-driven eligibility/coverage rule evaluation, own Postgres store (billing_engine schema)"
requires-python = ">=3.10,<4.0"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    # The engine's own store (design.md decision 5) is a throwaway-per-test Postgres cluster in
    # the migration suite, same driver pulse-ledger pins for its `ledger` schema.
    "psycopg[binary,pool]>=3.2",
    # The consume/declare loop (task 3.2+) rides pulse_core.connector; the migration-only scope
    # of this task does not import it yet, but the package is built on the kit from the start.
    "pulse-core",
]

[tool.uv.sources]
pulse-core = { workspace = true }

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
