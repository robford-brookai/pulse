[project]
name = "billing"
version = "0.1.0"
description = "PULSE billing engine — event-driven eligibility/coverage rule evaluation, own Postgres store (billing_engine schema)"
requires-python = ">=3.10,<4.0"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    # The engine's own store (design.md decision 5) is a throwaway-per-test Postgres cluster in
    # the migration suite, same driver pulse-ledger pins for its `ledger` schema.
    "psycopg[binary,pool]>=3.2",
    # The consume loop (task 3.2) rides pulse_core.connector's read/consume primitives.
    "pulse-core",
]

[tool.uv.sources]
pulse-core = { workspace = true }

[dependency-groups]
dev = [
    # Enforces the no-live-network posture for the fact-fold tests, which block sockets
    # per-module rather than trusting the `--disable-socket` flag — same plugin twenty-projection,
    # verdict-relay, schedules, and consent-ingress already use.
    "pytest-socket>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --allow-unix-socket: harmless under `--disable-socket` (AF_UNIX can't reach the network) and
# required for it — the migration suite's throwaway Postgres cluster is unix-socket only.
addopts = "--allow-unix-socket"
