site_name: repo-ade
repo_url: https://github.com/robford-brookai/repo-ade
site_url: https://robford-brookai.github.io/repo-ade
site_description: Repository agent development environment scaffold
site_author: Rob Ford
edit_uri: edit/main/docs/
repo_name: robford-brookai/repo-ade
copyright: Maintained by <a href="https://robford-brookai.com">robford-brookai</a>.

nav:
  - Home: index.md
  - Architecture: architecture.html
  - Modules: modules.md
  - Runbooks:
      - Month-open: runbooks/month-open.md
      - Consent-sweep: runbooks/consent-sweep.md
      - Identity-quarantine: runbooks/identity-quarantine.md
      - Demo 2 (partial) — s13+s14: runbooks/demo2-partial-s13-s14.md
      - Catalog-release: runbooks/catalog-release.md
      - Twenty-webhook: runbooks/twenty-webhook.md
      - Pulse-command-api-deploy: runbooks/pulse-command-api-deploy.md
      - Twenty-artifact-promotion: runbooks/twenty-artifact-promotion.md
      - Twenty-projection: runbooks/twenty-projection.md
      - Billing-state: runbooks/billing-state.md
      - Warehouse-sync-revival: runbooks/warehouse-sync-revival.md
  - Contracts:
      - Consumes: contracts/consumes.md
      - Publishes: contracts/publishes.md
      - Producer-registry: contracts/producer-registry.md
      - Billing-boundary: contracts/billing-boundary.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/pkg_pulse"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/robford-brookai/repo-ade
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/repo-ade

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
