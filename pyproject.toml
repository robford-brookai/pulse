[project]
name = "pulse"
version = "0.0.1"
description = "Patient unified ledger of state and events"
authors = [{ name = "pulse" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://robford-brookai.github.io/repo-ade/"
Repository = "https://github.com/robford-brookai/repo-ade"
Documentation = "https://robford-brookai.github.io/repo-ade/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "mypy>=1.19.1",
    "ruff>=0.15.7",
    # Used directly by the tests/scaffold gates. pyyaml is otherwise only a
    # transitive mkdocs dependency; tomllib is stdlib from 3.11 and CI tests 3.10.
    "pyyaml>=6.0",
    # Stubs for pulse_core.catalog_gen, which reads the state catalog seed under strict mypy.
    "types-pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    # The mkdocs stack is pinned to its 1.x-era majors (DNA-782): mkdocs v2 is a ground-up
    # rewrite with no plugin system or migration path that may ship to PyPI under the same
    # name, and some plugin releases pull successor forks (properdocs) transitively.
    # `task docs:lock-guard` enforces the lock side of this.
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.7.6,<10",
    "mkdocstrings[python]>=1.0.3,<2",
    "boto3-stubs[events]>=1.42.0",
    # Starlette's TestClient transport, used by the ledger command-API suite. It speaks ASGI
    # in-process — no socket, so the no-live-network posture holds.
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkg_pulse"]

[tool.uv.workspace]
members = [
    "packages/pulse-ledger",
    "packages/pulse-core",
    "packages/verdict-relay",
    "packages/schedules",
    "packages/identity",
    "packages/consent-ingress",
    "packages/ocean",
    "packages/ocean/libs/ocean-events",
    "packages/ocean/libs/ocean-broker",
    "packages/ocean/libs/ocean-connector-mcp",
]

[tool.uv.sources]
pulse-ledger = { workspace = true }
pulse-core = { workspace = true }
verdict-relay = { workspace = true }
schedules = { workspace = true }
identity = { workspace = true }
consent-ingress = { workspace = true }
ocean-events = { workspace = true }
ocean-broker = { workspace = true }
ocean-connector-mcp = { workspace = true }

[tool.mypy]
files = ["src"]
# ocean-events models are pydantic; without the plugin mypy misreads model_config and
# reports 23 spurious arg-type errors on a single __init_subclass__ line.
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party MSK IAM signer ships no py.typed marker and has no stubs on PyPI. Per-module and
# narrow rather than a blanket ignore — and it disappears entirely with the Kafka teardown
# (task 9.2), so this override should be deleted then.
module = "aws_msk_iam_sasl_signer.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scaffold gates 7 and 9 spin up a git sandbox and a fresh-clone `uv sync`.
# They are excluded from the default run; `task test:all` includes them.
# `integration` (task 4.5) needs Docker (LocalStack via testcontainers) and no live network in
# CI by default (see Conventions in CLAUDE.md); `task test:integration` runs it explicitly.
markers = [
    "slow: sandbox and fresh-clone gates, excluded from the default run",
    "integration: needs Docker, excluded from the default run",
]
addopts = '-m "not slow and not integration"'
# The scaffold gates are named cat1_structure.py .. cat9_golden_workflow.py so the filename
# states which gate it is. Without this they match no default pattern and are silently skipped
# by `task test` and CI, while still passing when run by explicit path.
python_files = ["test_*.py", "cat[0-9]_*.py"]
# Leaked OS resources fail the run. Both lines are load-bearing and neither works alone:
# Python ignores ResourceWarning by default, so the first surfaces it at all; a warning raised
# during garbage collection cannot propagate, so pytest re-reports it as an unraisable-exception
# warning, and the second is what turns that into a failure. Verified against the unclosed
# sqlite3.Connection in graph-projection's handler tests: with only one filter the run stayed
# green. Its own attribution is unreliable — the warning names whichever test was executing when
# the collector happened to fire, not the test that leaked — so the message points at the wrong
# place and the failure is the signal, not the location.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.report]
# Applies wherever coverage runs (`task test`, tox), not just in CI. The floor is currently
# trivially met — src/ is a two-statement placeholder — and becomes a real gate as the package
# grows. tests/scaffold/ measures the scaffold, not src/, so it does not inflate this number.
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# Package tests live under packages/*, which the "tests/*" pattern above does not reach.
# Same exemption, same reason: pytest asserts are the point.
"packages/pulse-ledger/tests/**" = ["S101"]
"packages/pulse-core/tests/**" = ["S101"]
"packages/verdict-relay/tests/**" = ["S101"]
"packages/schedules/tests/**" = ["S101"]
"packages/identity/tests/**" = ["S101"]
"packages/consent-ingress/tests/**" = ["S101"]

"packages/ocean/tests/**" = ["S101", "S105", "B017"]
"packages/ocean/**/tests/**" = ["S101", "S105", "B017"]

# Genuine inherited debt in the absorbed tree, ~37 findings. Scoped to packages/ocean
# deliberately: in the global `ignore` list these would also switch the checks off for
# src/pkg_pulse, which is not a trade worth making for an import. Burning them down is ocean's
# own follow-up, not a precondition of absorption.
"packages/ocean/**" = [
    # Style and structure — burn down opportunistically.
    "A002", "B008", "B904", "B905",
    "BLE", "C408", "C901", "E402", "F841",
    "RUF005", "RUF006", "RUF012", "RUF015", "RUF022", "RUF059", "RUF063",
    "SIM102", "SIM105", "SIM108", "SIM117",
    "TRY002", "TRY003", "TRY300", "TRY301", "TRY400", "UP009",
    # Security-relevant, and NOT style. Suppressed only to unblock absorption, tracked as
    # follow-up work rather than accepted: S608 hardcoded SQL (11 sites) is the one that
    # matters most in a repo that will carry PHI. Do not extend this group.
    "S104", "S106", "S110", "S310", "S311", "S324", "S607", "S608",
]

[tool.ruff.format]
preview = true
