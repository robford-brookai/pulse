repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.7"
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: openlore-drift
        name: openlore drift
        entry: openlore drift --fail-on warning
        language: system
        pass_filenames: false
        # Drift is code-vs-spec, so only run when code or specs are staged. `drift` also reports
        # every new markdown file as `uncovered` — with --fail-on warning that makes a docs-only
        # commit impossible, which is how the design set under design/ was blocked. Scoping when
        # the hook fires keeps the gate at full strength where it means something; downgrading to
        # --fail-on error would have weakened it everywhere instead.
        files: ^(src/.*\.py|openspec/.*)$
