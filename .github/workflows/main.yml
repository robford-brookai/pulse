name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # go-task is not preinstalled on runners. Pinned to a commit SHA with the version in a
      # comment; verified `runs.using: node24` (current LTS) on 2026-07-31.
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Must stay `task check` — tests/scaffold/cat4_ci_contract.py asserts every command in
      # this file resolves to a defined Taskfile target or a known tool. This step previously
      # ran `make check` against a repo with no Makefile, and every run failed for a week.
      - name: Run checks
        run: task check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run mypy



  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Lockfile guard (DNA-782): the mkdocs 1.x stack is pinned; fail fast if the lock
      # drifted or resolved a successor fork (properdocs, zensical).
      - name: Guard the docs dependency lock
        run: task docs:lock-guard

      - name: Check if documentation can be built
        run: task docs:build
