name: CI Health Check

on:
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@0000000000000000000000000000000000000000 # v4.0

      - name: Set up the environment (short)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          uv-version: '0.10.12'

      - name: Run quick health checks
        run: bash -lc 'set -e; echo "Checking uv sync with retries"; tries=0; until [ $tries -ge 3 ]; do uv sync --all-packages --frozen && break; tries=$((tries+1)); echo "uv sync failed, retrying ($tries/3)..."; sleep $((tries * 5)); done; if [ $tries -ge 3 ]; then echo "uv sync failed after 3 attempts" >&2; exit 1; fi; echo "Verifying critical imports"; python -c "import importlib, sys; importlib.import_module(\"pydantic\"); importlib.import_module(\"uvicorn\"); print('OK')"'
