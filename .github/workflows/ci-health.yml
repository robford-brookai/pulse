name: CI Health Check

on:
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment (short)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          uv-version: '0.10.12'

      - name: Run quick health checks
        run: |
          set -e
          echo "Checking uv sync with retries"
          tries=0
          until [ $tries -ge 3 ]; do
            uv sync --all-packages --frozen && break
            tries=$((tries+1))
            echo "uv sync failed, retrying ($tries/3)..."
            sleep $((tries * 5))
          done
          if [ $tries -ge 3 ]; then
            echo "uv sync failed after 3 attempts" >&2
            exit 1
          fi

          echo "Verifying critical imports"
          python - <<'PY'
          import importlib, sys
          for mod in ("pydantic", "uvicorn"):
              try:
                  importlib.import_module(mod)
                  print(f"{mod} OK")
              except Exception as e:
                  print(f"{mod} import failed: {e}")
                  sys.exit(1)
          PY
