name: Transport integration

# A distinct required check from `task check` (design.md decision 2, critical-path-verification
# task 2.1): the quality job's Postgres-only runner has no Docker/LocalStack, and `task check`
# must stay the fast, credential-free contract CI and local share (docs/ci-lessons.md). This job
# runs the same pinned, credential-free LocalStack image the existing relay integration suite
# already pins (packages/pulse-ledger/tests/integration/test_localstack_relay.py:
# `localstack/localstack:4.6`), bounded so a container that never becomes healthy fails the job
# instead of hanging it. Docker ships on `ubuntu-latest` already, so no provisioning step is
# needed; the container itself is torn down by the suite's own `testcontainers` context manager
# on exit, success or failure alike.
#
# Not yet an activated GitHub required-check rule — that is task 3.1's attended
# repository-administration receipt (spec: "Required check activation has a receipt"). This
# workflow existing and running green is the prerequisite for that step, not the step itself.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # PULSE_TRANSPORT_MODE=required makes the transport gate fail closed: a missing
      # environment, zero collection, a skipped case, or a timeout fails this job rather than
      # passing quietly; unset locally, `task test:transport` defaults to optional. No AWS
      # credentials are set here — the suite's own fixture supplies LocalStack's fixed test
      # credentials after scrubbing any real ones from the environment.
      - name: Run transport integration check
        env:
          PULSE_TRANSPORT_MODE: required
        run: task test:transport

      - name: Upload transport-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transport-gate-evidence
          path: .planning/evidence/
          if-no-files-found: warn
