name: Auto Heal CI

on:
  workflow_run:
    workflows: ["Main"]
    types: [completed]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    outputs:
      healthy: ${{ steps.aggregate.outputs.healthy }}
    steps:
      - name: Check out
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0

      - name: Diagnose Python 3.10
        id: d310
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.10
        id: ci310
        run: python .github/scripts/check_imports.py pydantic uvicorn
        continue-on-error: true

      - name: Diagnose Python 3.11
        id: d311
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.11
        id: ci311
        run: python .github/scripts/check_imports.py pydantic uvicorn
        continue-on-error: true

      - name: Diagnose Python 3.12
        id: d312
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.12
        id: ci312
        run: python .github/scripts/check_imports.py pydantic uvicorn
        continue-on-error: true

      - name: Diagnose Python 3.13
        id: d313
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.13'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.13
        id: ci313
        run: python .github/scripts/check_imports.py pydantic uvicorn
        continue-on-error: true

      - name: Diagnose Python 3.14
        id: d314
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.14'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.14
        id: ci314
        run: python .github/scripts/check_imports.py pydantic uvicorn
        continue-on-error: true

      - name: Aggregate diagnostics
        id: aggregate
        env:
          ci310: ${{ steps.ci310.outcome }}
          ci311: ${{ steps.ci311.outcome }}
          ci312: ${{ steps.ci312.outcome }}
          ci313: ${{ steps.ci313.outcome }}
          ci314: ${{ steps.ci314.outcome }}
        run: bash .github/scripts/aggregate_diagnostics.sh
        shell: bash

  rerun:
    needs: diagnose
    runs-on: ubuntu-latest
    if: ${{ needs.diagnose.outputs.healthy == 'true' && github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      actions: write
    steps:
      - name: Re-run failed workflow
        uses: actions/github-script@e69ef5462fd455e02edcaf4dd7708eda96b9eda0 # v7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            })

  notify:
    needs: diagnose
    runs-on: ubuntu-latest
    if: ${{ needs.diagnose.outputs.healthy != 'true' && github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Open issue for human attention
        uses: actions/github-script@e69ef5462fd455e02edcaf4dd7708eda96b9eda0 # v7.0
        with:
          script: |
            github.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI auto-heal diagnostic failed for run ${context.payload.workflow_run.id}`,
              body: `Auto-heal diagnostic failed for workflow run: ${context.payload.workflow_run.html_url}\n\nPlease inspect and resolve.`
            })
