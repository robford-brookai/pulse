name: Auto Heal CI

on:
  workflow_run:
    workflows: ["Main"]
    types: [completed]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    outputs:
      healthy: ${{ steps.aggregate.outputs.healthy }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Diagnose Python 3.10
        id: d310
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.10
        id: ci310
        run: |
          python - <<'PY'
          import importlib, sys
          try:
              importlib.import_module('pydantic')
              importlib.import_module('uvicorn')
              print('OK')
          except Exception as e:
              print('FAIL', e)
              exit(1)
          PY
        continue-on-error: true

      - name: Diagnose Python 3.11
        id: d311
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.11
        id: ci311
        run: |
          python - <<'PY'
          import importlib, sys
          try:
              importlib.import_module('pydantic')
              importlib.import_module('uvicorn')
              print('OK')
          except Exception as e:
              print('FAIL', e)
              exit(1)
          PY
        continue-on-error: true

      - name: Diagnose Python 3.12
        id: d312
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.12
        id: ci312
        run: |
          python - <<'PY'
          import importlib, sys
          try:
              importlib.import_module('pydantic')
              importlib.import_module('uvicorn')
              print('OK')
          except Exception as e:
              print('FAIL', e)
              exit(1)
          PY
        continue-on-error: true

      - name: Diagnose Python 3.13
        id: d313
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.13'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.13
        id: ci313
        run: |
          python - <<'PY'
          import importlib, sys
          try:
              importlib.import_module('pydantic')
              importlib.import_module('uvicorn')
              print('OK')
          except Exception as e:
              print('FAIL', e)
              exit(1)
          PY
        continue-on-error: true

      - name: Diagnose Python 3.14
        id: d314
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.14'
          uv-version: '0.10.12'
        continue-on-error: true

      - name: Check imports 3.14
        id: ci314
        run: |
          python - <<'PY'
          import importlib, sys
          try:
              importlib.import_module('pydantic')
              importlib.import_module('uvicorn')
              print('OK')
          except Exception as e:
              print('FAIL', e)
              exit(1)
          PY
        continue-on-error: true

      - name: Aggregate diagnostics
        id: aggregate
        run: |
          set -e
          fail_count=0
          for id in ci310 ci311 ci312 ci313 ci314; do
            outcome=${{ steps[id].outcome }}
            echo "$id -> $outcome"
            if [ "${{ steps[id].outcome }}" != "success" ]; then
              fail_count=$((fail_count+1))
            fi
          done
          if [ "$fail_count" -eq 0 ]; then
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  rerun:
    needs: diagnose
    runs-on: ubuntu-latest
    if: ${{ needs.diagnose.outputs.healthy == 'true' && github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Re-run failed workflow
        uses: peter-evans/re-run-workflow@v2
        with:
          run_id: ${{ github.event.workflow_run.id }}
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: diagnose
    runs-on: ubuntu-latest
    if: ${{ needs.diagnose.outputs.healthy != 'true' && github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Open issue for human attention
        uses: actions/github-script@v7
        with:
          script: |
            github.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI auto-heal diagnostic failed for run ${context.payload.workflow_run.id}`,
              body: `Auto-heal diagnostic failed for workflow run: ${context.payload.workflow_run.html_url}\n\nPlease inspect and resolve.`
            })
