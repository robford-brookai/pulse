# Staging population regeneration (synthea-seed change, design.md decision 5). This workflow
# is regeneration infrastructure, not CI: it is never reached from `task check`, main.yml stays
# exactly `task check`, and Java exists only here — the cat4 CI-contract gate holds by
# construction because the single run step resolves to a Taskfile target. Scheduled rather than
# per-PR (50k patients is not inner-loop work); the artifact is what the staging loader
# (environment-matrix, later) consumes. Synthetic data only — nothing here can touch PHI.
name: Synthea regen

on:
  workflow_dispatch:
    inputs:
      repin:
        description: "Author the manifest from this run instead of verifying it (bootstrap or reviewed re-pin)"
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 06:00 UTC — refreshed per release cadence, cheap to re-dispatch on demand.
    - cron: "0 6 * * 1"

jobs:
  regen-staging:
    runs-on: ubuntu-latest
    # A 50k generation runs ~40 minutes; the six-hour default would burn most of a runner-day
    # on a hung download rather than failing.
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # go-task is not preinstalled on runners. Same pin as main.yml.
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Java is a prerequisite of `task synthea:regen` only — never of `task check`.
      - name: Install Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      # The pinned JAR is ~500 MB and gitignored, so every weekly run re-downloaded it from
      # GitHub releases. Keyed on the pin file: editing the pin — the only way the JAR changes —
      # misses the cache by construction, and `ensure_jar` re-verifies the sha256 either way,
      # so a poisoned cache cannot generate.
      - name: Cache the pinned Synthea JAR
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/synthea-seed/.jars
          key: synthea-jar-${{ hashFiles('packages/synthea-seed/src/synthea_seed/config/synthea-pin.yaml') }}

      # cat4: the run step resolves to a Taskfile target. Verifies the output against the
      # committed staging manifest and fails naming diverging files. This runner is the
      # manifest-authoring platform of record (synthea-pin.yaml header — JVM determinism does
      # not carry across machines), so re-pinning happens here, through the `repin` dispatch
      # input: never on a schedule, and never implicitly. The manifest it writes is uploaded as
      # its own artifact for review and commit; nothing is written back to the branch.
      - name: Regenerate and verify the staging population
        run: task synthea:regen PROFILE=staging ${{ inputs.repin && 'REPIN=1' || '' }}

      - name: Upload the re-pinned staging manifest
        if: ${{ inputs.repin }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthea-staging-manifest
          path: packages/synthea-seed/manifests/staging.manifest.json
          if-no-files-found: error

      - name: Upload the staging population artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthea-staging-population
          path: packages/synthea-seed/output/staging
          if-no-files-found: error
