name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.10.12"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: 'true'
        cache-suffix: ${{ matrix.python-version }}

    - name: Install Python dependencies
      # --all-packages: the workspace has members under packages/, and typecheck and
      # test now cover them. A root-only sync leaves their deps missing, which fails
      # as an unimportable mypy plugin rather than as anything obviously about deps.
      run: |
        set -e
        tries=0
        until [ $tries -ge 3 ]; do
          uv sync --all-packages --frozen && break
          tries=$((tries+1))
          echo "uv sync failed, retrying ($tries/3)..."
          sleep $((tries * 5))
        done
        if [ $tries -ge 3 ]; then
          echo "uv sync failed after 3 attempts" >&2
          exit 1
        fi
      shell: bash
